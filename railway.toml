# CP5 — Railway build từ Dockerfile; secrets đặt trong service Variables.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Dùng CMD của Dockerfile: đọc PORT và exec Uvicorn để nhận SIGTERM.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
